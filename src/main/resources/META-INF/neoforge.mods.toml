modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 拔刀剑前置。下限 2.0.2 是编译所用版本，也是本模组验证过的第一个版本；
# 待机刀渲染拦截对 2.0.2～2.0.7（方法在 LayerMainBlade）与 2.0.8～2.1.9（方法上移到父类
# LayerSlashBlade）两个分支都做了适配，见 mixin 包下两个 Layer*Mixin 的说明。
[[dependencies.${mod_id}]]
modId="slashblade"
type="required"
versionRange="[2.0.2,)"
ordering="AFTER"
side="BOTH"

# 可选联动：铁魔法。下限 3.9.1 = 最早的 1.21.1 构建，故实际等于「任何 1.21.1 版铁魔法」。
# 必须带 1.21.1- 前缀；只写 [3.9,) 会因 Maven 版本比较规则而一个都匹配不上。
[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="optional"
versionRange="[1.21.1-3.9,)"
ordering="AFTER"
side="BOTH"