modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# mixin 配置在这里**声明无效**。
# 1.20.1 的 FML 只从 jar MANIFEST 的 MixinConfigs 属性收集 mixin 配置（见 build.gradle 的 jar 任务）；
# Forge 官方 mods.toml 规范里也没有 mixins 这一项（那是 NeoForge 的新格式）。
# 实测写成 [[mixins]] config=... 在 dev 与生产下都完全不生效，且不报任何错。

# FML 47.x（1.20.1）的依赖声明用的是 mandatory/versionRange 这套老格式，
# 而不是 1.21 的 type/versionRange；写成 type 会得到
# "Missing required field mandatory in dependency"。
#
# 装载器的 modId 在 1.20.1 是 forge —— **Forge 与 NeoForge 共用这一个 id**
# （neoforge 从 20.2 才开始使用），所以下面这条依赖同时满足两者，
# 本模组的 jar 也因此无需区分加载器。
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 拔刀剑前置。下限 1.9.0 是本模组声明的最低支持版本，开发与验证所用的是 1.9.65。
#
# 待机刀渲染拦截准备了 LayerMainBlade 与 LayerSlashBlade 两条注入：
# 前者是当前两个可用版本（1.20.1 的 1.9.65、1.21.1 分支开发期源码）里实际承载
# renderHotbarItem 的类；后者目前并不存在，属于「上游日后若把这批方法上移到父类」
# 的前瞻保险。详见 mixin 包下两个 Layer*Mixin 的说明。
[[dependencies.${mod_id}]]
modId="slashblade"
mandatory=true
versionRange="[1.9.0,)"
ordering="AFTER"
side="BOTH"

# 可选联动：铁魔法。下限用 1.20.1 系列的最早版本即可，
# 故实际等于「任何 1.20.1 版铁魔法」（必须带 1.20.1- 前缀）。
[[dependencies.${mod_id}]]
modId="irons_spellbooks"
mandatory=false
versionRange="[1.20.1-3.0,)"
ordering="AFTER"
side="BOTH"
